[project]
name = "mochi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "QuangMinhDinh-2007", email = "quangminhdinh2704@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "numpy>=2.0.2",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "ultralytics>=8.4.123",
]

[project.scripts]
mochi = "mochi:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
